version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umkm_toko_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
    volumes:
      - app_uploads:/app/uploads

volumes:
  app_uploads:
